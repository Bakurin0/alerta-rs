<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-size: 12px; fill: #64748b; text-anchor: middle; }
      .participant-box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; rx: 4; }
      .participant-text { font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #0f766e; stroke-width: 1.5; fill: none; }
      .return-line { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .msg-text { font-size: 11.5px; fill: #0f172a; }
      .activation { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.2; }
    </style>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#0f766e" />
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#0284c7" />
    </marker>
  </defs>

  <text x="450" y="28" class="title">Diagrama de Sequência — História 2: Mapa de Estações</text>
  <text x="450" y="46" class="subtitle">Fluxo de renderização cartográfica, projeção de coordenadas e seleção interativa</text>

  <!-- Participants -->
  <rect x="40" y="70" width="130" height="36" class="participant-box" />
  <text x="105" y="93" class="participant-text">:Usuário</text>
  <line x1="105" y1="106" x2="105" y2="460" class="lifeline" />

  <rect x="250" y="70" width="130" height="36" class="participant-box" />
  <text x="315" y="93" class="participant-text">:App (React)</text>
  <line x1="315" y1="106" x2="315" y2="460" class="lifeline" />

  <rect x="470" y="70" width="130" height="36" class="participant-box" />
  <text x="535" y="93" class="participant-text">:MapView</text>
  <line x1="535" y1="106" x2="535" y2="460" class="lifeline" />

  <rect x="680" y="70" width="180" height="36" class="participant-box" style="fill: #e0f2fe; stroke: #0284c7;" />
  <text x="770" y="93" class="participant-text" style="fill: #0369a1;">projectCoordinates()</text>
  <line x1="770" y1="106" x2="770" y2="460" class="lifeline" />

  <!-- Activations -->
  <rect x="310" y="130" width="10" height="300" class="activation" />
  <rect x="530" y="150" width="10" height="270" class="activation" />

  <!-- Messages -->
  <path d="M 105 130 L 310 130" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="115" y="122" class="msg-text">1: Clica na aba &quot;Mapa de estações&quot;</text>

  <path d="M 320 150 L 530 150" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="330" y="142" class="msg-text">2: Renderiza MapView(stations, onDetails)</text>

  <!-- Projection loop -->
  <path d="M 540 180 L 770 180" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="550" y="172" class="msg-text">3: projectCoordinates(station.latitude, station.longitude)</text>

  <path d="M 770 210 L 540 210" class="return-line" marker-end="url(#arrow-ret)" />
  <text x="560" y="202" class="msg-text">4: Retorna posição relativa { x: %, y: % } na malha do RS</text>

  <path d="M 530 250 L 105 250" class="return-line" marker-end="url(#arrow-ret)" />
  <text x="120" y="242" class="msg-text">5: Exibe mapa SVG do RS com marcadores plotados</text>

  <!-- User clicks marker -->
  <path d="M 105 300 L 530 300" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="120" y="292" class="msg-text">6: Clica sobre marcador de estação no mapa</text>

  <path d="M 540 320 L 580 320 L 580 340 L 540 340" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="585" y="333" class="msg-text">7: setSelected(station) [destaca marcador .selected]</text>

  <path d="M 530 380 L 105 380" class="return-line" marker-end="url(#arrow-ret)" />
  <text x="120" y="372" class="msg-text">8: Atualiza painel lateral com dados da estação e botão de detalhes</text>
</svg>