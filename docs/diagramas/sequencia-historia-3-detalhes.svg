<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-size: 12px; fill: #64748b; text-anchor: middle; }
      .participant-box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; rx: 4; }
      .participant-text { font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #0f766e; stroke-width: 1.5; fill: none; }
      .return-line { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .msg-text { font-size: 11.5px; fill: #0f172a; }
      .activation { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.2; }
    </style>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#0f766e" />
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#0284c7" />
    </marker>
  </defs>

  <text x="450" y="28" class="title">Diagrama de Sequência — História 3: Detalhes da Estação</text>
  <text x="450" y="46" class="subtitle">Fluxo de navegação para detalhes, formatação técnica e consolidação de medições</text>

  <!-- Participants -->
  <rect x="50" y="70" width="130" height="36" class="participant-box" />
  <text x="115" y="93" class="participant-text">:Usuário</text>
  <line x1="115" y1="106" x2="115" y2="440" class="lifeline" />

  <rect x="260" y="70" width="160" height="36" class="participant-box" />
  <text x="340" y="93" class="participant-text">:PanelView / MapView</text>
  <line x1="340" y1="106" x2="340" y2="440" class="lifeline" />

  <rect x="490" y="70" width="140" height="36" class="participant-box" />
  <text x="560" y="93" class="participant-text">:App (Controller)</text>
  <line x1="560" y1="106" x2="560" y2="440" class="lifeline" />

  <rect x="700" y="70" width="150" height="36" class="participant-box" />
  <text x="775" y="93" class="participant-text">:DetailsView</text>
  <line x1="775" y1="106" x2="775" y2="440" class="lifeline" />

  <!-- Activations -->
  <rect x="335" y="130" width="10" height="50" class="activation" />
  <rect x="555" y="160" width="10" height="240" class="activation" />
  <rect x="770" y="220" width="10" height="160" class="activation" />

  <!-- Messages -->
  <path d="M 115 130 L 335 130" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="130" y="122" class="msg-text">1: Clica no botão &quot;Ver detalhes&quot; / &quot;Abrir detalhes&quot;</text>

  <path d="M 345 160 L 555 160" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="355" y="152" class="msg-text">2: Executa callback onDetails(station)</text>

  <path d="M 565 180 L 610 180 L 610 200 L 565 200" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="615" y="193" class="msg-text">3: setSelected(station) + setView(&apos;details&apos;)</text>

  <path d="M 565 220 L 770 220" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="580" y="212" class="msg-text">4: Renderiza DetailsView(station=selected)</text>

  <path d="M 775 250 L 820 250 L 820 280 L 775 280" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="825" y="268" class="msg-text">5: Formata cotas (m), chuvas (mm) e data/hora</text>

  <path d="M 770 350 L 115 350" class="return-line" marker-end="url(#arrow-ret)" />
  <text x="140" y="342" class="msg-text">6: Exibe ficha completa: código, município, bacia, nível, chuva em várias janelas</text>

  <!-- User returns -->
  <path d="M 115 400 L 555 400" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="140" y="392" class="msg-text">7: Usuário clica em outra aba da barra superior para retornar</text>
</svg>